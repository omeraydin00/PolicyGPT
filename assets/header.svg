<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="PolicyGPT: Turkish government procedures, step by step.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#BC8CFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B949E" opacity="0.18"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="16"/></clipPath>
    <style>
      .mono  { font: 500 15px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
      .name  { font: 700 48px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F0F6FC; letter-spacing: -1px; }
      .meta  { font: 400 18px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8B949E; }
      .stack { font: 500 15px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: url(#accent); }
      .label { font: 600 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #C9D1D9; }
      .small { font: 600 12px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
      .hub   { font: 700 13px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #F0F6FC; letter-spacing: 1px; }
      .flow { stroke-dasharray: 6 14; animation: dash 1.2s linear infinite; opacity: 0.55; }
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .in { animation: in 0.8s ease-out backwards; }
      .i1 { animation-delay: 0.05s; } .i2 { animation-delay: 0.2s; } .i3 { animation-delay: 0.35s; } .i4 { animation-delay: 0.5s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes row0 { 0%, 10% { opacity: 0; transform: translateX(-10px); } 16%, 86% { opacity: 1; transform: translateX(0); } 94%, 100% { opacity: 0; transform: translateX(0); } } .row0 { animation: row0 7s ease-out infinite; }
      @keyframes row1 { 0%, 24% { opacity: 0; transform: translateX(-10px); } 30%, 86% { opacity: 1; transform: translateX(0); } 94%, 100% { opacity: 0; transform: translateX(0); } } .row1 { animation: row1 7s ease-out infinite; }
      @keyframes row2 { 0%, 38% { opacity: 0; transform: translateX(-10px); } 44%, 86% { opacity: 1; transform: translateX(0); } 94%, 100% { opacity: 0; transform: translateX(0); } } .row2 { animation: row2 7s ease-out infinite; }
      @keyframes row3 { 0%, 52% { opacity: 0; transform: translateX(-10px); } 58%, 86% { opacity: 1; transform: translateX(0); } 94%, 100% { opacity: 0; transform: translateX(0); } } .row3 { animation: row3 7s ease-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="15.5" fill="none" stroke="#30363D" stroke-width="1.5"/>

    <text x="64" y="70" class="mono in i1">~/omeraydin00/PolicyGPT</text>
    <text x="62" y="130" class="name in i2">PolicyGPT</text>
    <text x="64" y="172" class="meta in i3">Turkish government procedures, step by step.</text>
    <text x="64" y="212" class="stack in i4">Python · LangChain · Ollama · RAG</text>

    <rect x="760" y="40" width="124" height="180" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="776" y="60" width="64" height="9" rx="4" fill="url(#accent)" opacity="0.9"/>
    <rect x="776" y="76" width="40" height="6" rx="3" fill="#8B949E" opacity="0.5"/>
    <rect x="776" y="96" width="88" height="6" rx="3" fill="#30363D"/><rect x="776" y="110" width="70" height="6" rx="3" fill="#30363D"/><rect x="776" y="124" width="92" height="6" rx="3" fill="#30363D"/><rect x="776" y="138" width="60" height="6" rx="3" fill="#30363D"/><rect x="776" y="152" width="84" height="6" rx="3" fill="#30363D"/><rect x="776" y="166" width="76" height="6" rx="3" fill="#30363D"/><rect x="776" y="180" width="50" height="6" rx="3" fill="#30363D"/><rect x="776" y="194" width="80" height="6" rx="3" fill="#30363D"/>
    <rect x="768" y="90" width="108" height="14" rx="4" fill="#58A6FF" opacity="0.14">
      <animate attributeName="y" values="90;188;90" dur="7s" repeatCount="indefinite"/>
    </rect>
    <path d="M896 130 L960 130" stroke="#30363D" stroke-width="2" fill="none"/><path d="M896 130 L960 130" class="flow" stroke="#58A6FF" stroke-width="2" fill="none" style="animation-delay:0.0s"/>
    <circle r="4" fill="#79C0FF" opacity="0">
      <animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M896 130 L960 130"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#D2A8FF" opacity="0">
      <animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M896 130 L960 130"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <g class="row0">
      <rect x="975" y="52" width="170" height="34" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="995" cy="69" r="10" fill="#1F6FEB" opacity="0.9"/>
      <text x="995" y="73.5" text-anchor="middle" class="hub">1</text>
      <rect x="1015" y="66" width="110" height="6" rx="3" fill="#8B949E" opacity="0.5"/>
    </g><g class="row1">
      <rect x="975" y="96" width="170" height="34" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="995" cy="113" r="10" fill="#1F6FEB" opacity="0.9"/>
      <text x="995" y="117.5" text-anchor="middle" class="hub">2</text>
      <rect x="1015" y="110" width="90" height="6" rx="3" fill="#8B949E" opacity="0.5"/>
    </g><g class="row2">
      <rect x="975" y="140" width="170" height="34" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="995" cy="157" r="10" fill="#1F6FEB" opacity="0.9"/>
      <text x="995" y="161.5" text-anchor="middle" class="hub">3</text>
      <rect x="1015" y="154" width="116" height="6" rx="3" fill="#8B949E" opacity="0.5"/>
    </g><g class="row3">
      <rect x="975" y="184" width="170" height="34" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="995" cy="201" r="10" fill="#1F6FEB" opacity="0.9"/>
      <text x="995" y="205.5" text-anchor="middle" class="hub">4</text>
      <rect x="1015" y="198" width="80" height="6" rx="3" fill="#8B949E" opacity="0.5"/>
    </g>
  </g>
</svg>
